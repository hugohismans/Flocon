<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03060f" />
    <meta name="description" content="Faites pousser un flocon de neige unique, cristal par cristal." />
    <title>Flocons</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%23bfe3ff' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene" aria-label="Flocon de neige en croissance"></canvas>

    <header class="title">
      <h1>Flocons</h1>
      <p id="status" aria-live="polite"></p>
    </header>

    <button id="btn-sound" class="icon-button" type="button" aria-label="Couper le son" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="speaker" d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" />
        <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
        <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" />
      </svg>
    </button>

    <p class="hint" id="hint">Touchez près du flocon pour y souffler de la vapeur</p>

    <section class="panel" id="panel" aria-label="Réglages">
      <label class="control">
        <span class="control-head">
          <span>Humidité</span>
          <output id="humidity-value" for="humidity"></output>
        </span>
        <input id="humidity" type="range" min="0" max="100" step="1" />
      </label>
      <label class="control">
        <span class="control-head">
          <span>Température</span>
          <output id="temperature-value" for="temperature"></output>
        </span>
        <input id="temperature" type="range" min="-25" max="-1" step="0.5" />
      </label>
      <label class="control">
        <span class="control-head">
          <span>Vitesse</span>
          <output id="speed-value" for="speed"></output>
        </span>
        <input id="speed" type="range" min="0" max="100" step="1" />
      </label>
      <div class="actions">
        <button id="btn-freeze" class="primary" type="button">Geler</button>
        <button id="btn-new" type="button">Nouveau flocon</button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
